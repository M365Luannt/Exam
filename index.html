<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Trainer - Chế độ ôn luyện</title>
    <!-- Thư viện SheetJS để đọc file Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-sidebar: #25262b;
            --bg-main: #141518;
            --text-main: #ffffff;
            --text-muted: #909296;
            --accent-blue: #339af0;
            --success-bg: #1c3325;
            --success-text: #40c057;
            --error-bg: #3b1c1c;
            --error-text: #fa5252;
            --border-color: #373a40;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { display: flex; height: 100vh; background-color: var(--bg-main); color: var(--text-main); }

        /* Sidebar Styles */
        .sidebar { width: 250px; background-color: var(--bg-sidebar); padding: 20px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 20px; }
        .sidebar-section h3 { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; font-weight: 600; }
        .radio-group label { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 8px; cursor: pointer; }
        .stat-box { margin-bottom: 15px; }
        .stat-value { font-size: 24px; font-weight: bold; margin-top: 5px; }
        select { width: 100%; padding: 8px; background: #1a1b1e; border: 1px solid var(--border-color); color: white; border-radius: 4px; }

        /* Main Content Styles */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 28px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; }
        
        /* Progress Bar */
        .progress-container { width: 100%; height: 6px; background-color: var(--border-color); border-radius: 3px; margin-bottom: 30px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--accent-blue); transition: width 0.3s ease; }

        /* Question Styles */
        .question-number { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .question-text { font-size: 16px; margin-bottom: 20px; line-height: 1.5; }
        .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option-item { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; padding: 5px 0; }
        .option-item input[type="radio"] { margin-top: 4px; accent-color: var(--error-text); }
        .option-text { font-size: 14px; line-height: 1.4; }

        /* Feedback & Button */
        .feedback { padding: 15px; border-radius: 6px; margin-bottom: 20px; display: none; font-weight: 500; font-size: 15px; }
        .feedback.correct { background-color: var(--success-bg); color: var(--success-text); display: flex; align-items: center; gap: 10px; border: 1px solid #2b5c3d;}
        .feedback.incorrect { background-color: var(--error-bg); color: var(--error-text); display: flex; align-items: center; gap: 10px; border: 1px solid #732a2a;}
        
        .btn-next { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; display: none; align-items: center; gap: 8px; }
        .btn-next:hover { background-color: #2c2e33; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-section">
            <h3>Chế độ ôn luyện</h3>
            <div class="radio-group">
                <label><input type="radio" name="mode" disabled> Tất cả câu hỏi</label>
                <label><input type="radio" name="mode" checked> Theo bộ đề</label>
            </div>
        </div>
        <div class="sidebar-section">
            <h3>Chọn bộ đề</h3>
            <select id="examSetSelect">
                <option value="ALL">P01 - Tổng hợp</option>
            </select>
        </div>
        <div class="stat-box">
            <div class="sidebar-section"><h3>Điểm</h3></div>
            <div class="stat-value" id="scoreDisplay">0</div>
        </div>
        <div class="stat-box">
            <div class="sidebar-section"><h3>Số câu</h3></div>
            <div class="stat-value" id="totalDisplay">0</div>
        </div>
        <div class="stat-box">
            <div class="sidebar-section"><h3>Tiến độ</h3></div>
            <div class="stat-value" id="progressDisplay">0/0</div>
        </div>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>📝 Napas Exam Trainer</h1>
        </div>
        <div class="subtitle" id="subtitleDisplay">Đang tải dữ liệu bộ đề...</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
        </div>

        <div id="quizContainer">
            <div class="question-number" id="questionNumber">Đang tải...</div>
            <div class="question-text" id="questionText">Vui lòng chờ trong lúc hệ thống đọc file Excel...</div>
            
            <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px;">Chọn đáp án</div>
            <div class="options-list" id="optionsList">
                <!-- Options will be generated here by JS -->
            </div>

            <div class="feedback" id="feedbackBox">
                <span id="feedbackIcon"></span>
                <span id="feedbackText"></span>
            </div>

            <button class="btn-next" id="btnNext" onclick="nextQuestion()">➡️ Câu tiếp theo</button>
        </div>
    </main>

    <script>
        let questions = []; 
        let currentIndex = 0;
        let score = 0;
        let answeredCurrent = false;

        // Các thành phần DOM
        const qNumberEl = document.getElementById('questionNumber');
        const qTextEl = document.getElementById('questionText');
        const optionsListEl = document.getElementById('optionsList');
        const feedbackBox = document.getElementById('feedbackBox');
        const feedbackIcon = document.getElementById('feedbackIcon');
        const feedbackText = document.getElementById('feedbackText');
        const btnNext = document.getElementById('btnNext');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const totalDisplay = document.getElementById('totalDisplay');
        const progressDisplay = document.getElementById('progressDisplay');
        const progressBar = document.getElementById('progressBar');

        // Hàm đọc trực tiếp cấu trúc file Excel P01-QTHT
        async function loadExcelData() {
            try {
                // Tên file gốc của bạn phải khớp chính xác trên GitHub
                const response = await fetch('P01-QTHT Hieu biet ve sp dv nghiep vu thanh toan.xlsx');
                if (!response.ok) throw new Error("Không tìm thấy file Excel");
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                
                // Tự động tìm sheet 'P01_final' hoặc lấy sheet cuối cùng
                const sheetName = workbook.SheetNames.find(n => n.includes('final')) || workbook.SheetNames[workbook.SheetNames.length - 1];
                const worksheet = workbook.Sheets[sheetName];
                
                // Đọc dữ liệu thành mảng 2 chiều (header: 1)
                const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                questions = [];
                
                // Tự động dò dòng bắt đầu chứa dữ liệu (sau các dòng tiêu đề)
                let startIndex = 12; // Mặc định là dòng 13 trong Excel
                for (let i = 0; i < 20; i++) {
                    if (rawData[i] && rawData[i][5] === 'Câu hỏi') {
                        startIndex = i + 3;
                        break;
                    }
                }

                for (let i = startIndex; i < rawData.length; i++) {
                    const row = rawData[i];
                    
                    // Bỏ qua nếu cột F (index 5) trống
                    if (!row || !row[5] || String(row[5]).trim() === '') continue; 
                    
                    const questionText = String(row[5]).trim();
                    const correctAnswer = row[6] ? String(row[6]).trim() : "";
                    
                    // Bỏ qua nếu không có đáp án đúng ở Cột G
                    if (!correctAnswer) continue; 

                    // Gom đáp án đúng (Cột G) và 3 đáp án sai (Cột H, I, J) vào một mảng
                    let allOptions = [correctAnswer];
                    if (row[7] && String(row[7]).trim() !== '') allOptions.push(String(row[7]).trim());
                    if (row[8] && String(row[8]).trim() !== '') allOptions.push(String(row[8]).trim());
                    if (row[9] && String(row[9]).trim() !== '') allOptions.push(String(row[9]).trim());
                    
                    // Lưu giữ lại text đáp án đúng để đối chiếu sau khi xáo trộn
                    const exactCorrectText = allOptions[0];

                    // Xáo trộn vị trí các đáp án ngẫu nhiên
                    for (let j = allOptions.length - 1; j > 0; j--) {
                        const k = Math.floor(Math.random() * (j + 1));
                        [allOptions[j], allOptions[k]] = [allOptions[k], allOptions[j]];
                    }
                    
                    // Tìm lại vị trí (A, B, C hoặc D) của đáp án đúng sau khi đã xáo trộn
                    const correctIdx = allOptions.indexOf(exactCorrectText);
                    
                    questions.push({
                        question: questionText,
                        options: allOptions,
                        correctAnswerIndex: correctIdx
                    });
                }

                initQuiz();
            } catch (error) {
                console.error("Lỗi:", error);
                qTextEl.innerHTML = `<span style="color:red">Lỗi: Không thể tải file Excel. Vui lòng đảm bảo file "P01-QTHT Hieu biet ve sp dv nghiep vu thanh toan.xlsx" đã được upload cùng thư mục với index.html trên GitHub.</span>`;
            }
        }

        function initQuiz() {
            if(questions.length === 0) return;
            totalDisplay.innerText = questions.length;
            document.getElementById('subtitleDisplay').innerText = `Bộ đề: Tổng hợp (${questions.length} câu)`;
            loadQuestion(currentIndex);
        }

        function loadQuestion(index) {
            answeredCurrent = false;
            feedbackBox.style.display = 'none';
            btnNext.style.display = 'none';
            feedbackBox.className = 'feedback';
            
            const q = questions[index];
            qNumberEl.innerText = `Câu ${index + 1}`;
            qTextEl.innerText = q.question;
            
            progressDisplay.innerText = `${index + 1}/${questions.length}`;
            progressBar.style.width = `${((index + 1) / questions.length) * 100}%`;

            optionsListEl.innerHTML = '';
            q.options.forEach((optText, i) => {
                const label = document.createElement('label');
                label.className = 'option-item';
                
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'current_question';
                input.value = i;
                input.onclick = () => selectAnswer(i);

                const span = document.createElement('span');
                span.className = 'option-text';
                span.innerText = optText;

                label.appendChild(input);
                label.appendChild(span);
                optionsListEl.appendChild(label);
            });
        }

        function selectAnswer(selectedIndex) {
            if (answeredCurrent) return;
            answeredCurrent = true;

            const q = questions[currentIndex];
            const isCorrect = (selectedIndex === q.correctAnswerIndex);

            const inputs = optionsListEl.querySelectorAll('input[type="radio"]');
            inputs.forEach(input => input.disabled = true);

            feedbackBox.style.display = 'flex';
            if (isCorrect) {
                feedbackBox.classList.add('correct');
                feedbackIcon.innerHTML = '✅';
                feedbackText.innerText = 'Chính xác';
                score++;
                scoreDisplay.innerText = score;
            } else {
                feedbackBox.classList.add('incorrect');
                feedbackIcon.innerHTML = '❌';
                feedbackText.innerText = 'Chưa chính xác (Đáp án đúng là: ' + q.options[q.correctAnswerIndex] + ')';
            }

            btnNext.style.display = 'inline-flex';
            if (currentIndex === questions.length - 1) {
                btnNext.innerHTML = '🔄 Hoàn thành! Làm lại từ đầu';
            } else {
                btnNext.innerHTML = '➡️ Câu tiếp theo';
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                currentIndex = 0;
                score = 0;
                scoreDisplay.innerText = score;
                loadQuestion(currentIndex);
            }
        }

        // Bắt đầu đọc file Excel ngay khi trang web mở lên
        window.onload = loadExcelData;
    </script>
</body>
</html>
