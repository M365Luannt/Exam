<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Trainer - Ôn Luyện</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-sidebar: #25262b;
            --bg-main: #141518;
            --text-main: #ffffff;
            --text-muted: #909296;
            --accent-blue: #339af0;
            --success-bg: #1c3325;
            --success-text: #40c057;
            --error-bg: #3b1c1c;
            --error-text: #fa5252;
            --border-color: #373a40;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg-main); color: var(--text-main); }
        .sidebar { width: 250px; background-color: var(--bg-sidebar); padding: 20px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 20px; }
        .sidebar-section h3 { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; font-weight: 600; }
        .stat-box { margin-bottom: 15px; }
        .stat-value { font-size: 24px; font-weight: bold; margin-top: 5px; }
        select { width: 100%; padding: 8px; background: #1a1b1e; border: 1px solid var(--border-color); color: white; border-radius: 4px; cursor: pointer; outline: none; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 28px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; }
        .progress-container { width: 100%; height: 6px; background-color: var(--border-color); border-radius: 3px; margin-bottom: 30px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--accent-blue); transition: width 0.3s ease; }
        .question-number { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .question-text { font-size: 16px; margin-bottom: 20px; line-height: 1.5; }
        .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option-item { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; padding: 5px 0; }
        .option-item input[type="radio"] { margin-top: 4px; accent-color: var(--error-text); }
        .option-text { font-size: 14px; line-height: 1.4; }
        .feedback { padding: 15px; border-radius: 6px; margin-bottom: 20px; display: none; font-weight: 500; font-size: 15px; }
        .feedback.correct { background-color: var(--success-bg); color: var(--success-text); display: flex; align-items: center; gap: 10px; border: 1px solid #2b5c3d;}
        .feedback.incorrect { background-color: var(--error-bg); color: var(--error-text); display: flex; align-items: center; gap: 10px; border: 1px solid #732a2a;}
        .btn-next { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; display: none; align-items: center; gap: 8px; }
        .btn-next:hover { background-color: #2c2e33; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-section">
            <h3>Chọn bộ đề</h3>
            <select id="examSetSelect"></select>
        </div>
        <div class="stat-box">
            <div class="sidebar-section"><h3>Điểm</h3></div>
            <div class="stat-value" id="scoreDisplay">0</div>
        </div>
        <div class="stat-box">
            <div class="sidebar-section"><h3>Số câu</h3></div>
            <div class="stat-value" id="totalDisplay">0</div>
        </div>
        <div class="stat-box">
            <div class="sidebar-section"><h3>Tiến độ</h3></div>
            <div class="stat-value" id="progressDisplay">0/0</div>
        </div>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>📝 Napas Exam Trainer</h1>
        </div>
        <div class="subtitle" id="subtitleDisplay">Đang tải dữ liệu bộ đề...</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
        </div>

        <div id="quizContainer">
            <div class="question-number" id="questionNumber">Đang tải...</div>
            <div class="question-text" id="questionText">Vui lòng chờ trong lúc hệ thống đọc file Excel...</div>
            
            <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px;">Chọn đáp án</div>
            <div class="options-list" id="optionsList"></div>

            <div class="feedback" id="feedbackBox">
                <span id="feedbackIcon"></span>
                <span id="feedbackText"></span>
            </div>

            <button class="btn-next" id="btnNext" onclick="nextQuestion()">➡️ Câu tiếp theo</button>
        </div>
    </main>

    <script>
        // Cập nhật lại danh sách file
        const examFiles = [
            { file: 'P01-QTHT Hieu biet ve sp dv nghiep vu thanh toan.xlsx', name: 'P01 - Nghiệp vụ thanh toán' },
            { file: 'P09-QTHT Phan tich nghiep vu.xlsx', name: 'P09 - Phân tích nghiệp vụ' },
            { file: 'P10-QTHT Thiet ke kien truc CNTT.xlsx', name: 'P10 - Thiết kế kiến trúc CNTT' },
            { file: 'P12-QTHT Quan tri va khai thac du lieu CNTT.xlsx', name: 'P12 - Quản trị và khai thác dữ liệu CNTT' },
            { file: 'P13b-QTHT Dam bao chat luong dich vu CNTT.xlsx', name: 'P13b - Đảm bảo chất lượng dịch vụ CNTT' },
            { file: 'P15-QTHT Van hanh quan tri ha tang CNTT.xlsx', name: 'P15 - Vận hành quản trị hạ tầng CNTT' },
            { file: 'P16-QTHT An toan va ANTT.xlsx', name: 'P16 - An toàn và ANTT' },
            { file: 'P20-QTHT Mua sam.xlsx', name: 'P20 - Mua sắm' },
            { file: 'P21-QTHT Hieu biet ve Cong ty.xlsx', name: 'P21 - Hiểu biết về Công ty' },
            { file: 'P30-QTHT Quan tri rui ro.xlsx', name: 'P30 - Quản trị rủi ro' }
        ];

        let questions = []; 
        let currentIndex = 0;
        let score = 0;
        let answeredCurrent = false;

        const selectEl = document.getElementById('examSetSelect');
        const qNumberEl = document.getElementById('questionNumber');
        const qTextEl = document.getElementById('questionText');
        const optionsListEl = document.getElementById('optionsList');
        const feedbackBox = document.getElementById('feedbackBox');
        const feedbackIcon = document.getElementById('feedbackIcon');
        const feedbackText = document.getElementById('feedbackText');
        const btnNext = document.getElementById('btnNext');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const totalDisplay = document.getElementById('totalDisplay');
        const progressDisplay = document.getElementById('progressDisplay');
        const progressBar = document.getElementById('progressBar');

        function setupDropdown() {
            selectEl.innerHTML = '';
            examFiles.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.file;
                opt.textContent = f.name;
                selectEl.appendChild(opt);
            });

            selectEl.addEventListener('change', (e) => {
                loadExcelData(e.target.value);
            });
        }

        async function loadExcelData(filename) {
            questions = [];
            currentIndex = 0;
            score = 0;
            scoreDisplay.innerText = 0;
            qNumberEl.innerText = 'Đang tải...';
            qTextEl.innerText = `Đang xử lý file ${filename}...`;
            optionsListEl.innerHTML = '';
            feedbackBox.style.display = 'none';
            btnNext.style.display = 'none';

            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error("Không tìm thấy file Excel");
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                
                const sheetName = workbook.SheetNames.find(n => n.includes('final')) || workbook.SheetNames[workbook.SheetNames.length - 1];
                const worksheet = workbook.Sheets[sheetName];
                
                const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                let qIdx = -1;
                let startIndex = 12; 

                // TỰ ĐỘNG DÒ TÌM VỊ TRÍ CỘT CÂU HỎI VÀ ĐÁP ÁN (Bỏ fix cứng cột)
                for (let i = 0; i < 20; i++) {
                    const row = rawData[i];
                    if (!row) continue;
                    
                    qIdx = row.findIndex(cell => typeof cell === 'string' && cell.trim() === 'Câu hỏi');
                    if (qIdx !== -1) {
                        startIndex = i + 3; // Dữ liệu luôn cách dòng header 3 dòng
                        break;
                    }
                }

                if (qIdx === -1) {
                     throw new Error("Không tìm thấy tiêu đề 'Câu hỏi' trong bảng.");
                }

                for (let i = startIndex; i < rawData.length; i++) {
                    const row = rawData[i];
                    
                    // Nếu ô câu hỏi trống thì bỏ qua dòng đó
                    if (!row || !row[qIdx] || String(row[qIdx]).trim() === '') continue; 
                    
                    const questionText = String(row[qIdx]).trim();
                    const correctAnswer = row[qIdx + 1] ? String(row[qIdx + 1]).trim() : "";
                    
                    if (!correctAnswer) continue; 

                    let allOptions = [correctAnswer];
                    if (row[qIdx + 2] && String(row[qIdx + 2]).trim() !== '') allOptions.push(String(row[qIdx + 2]).trim());
                    if (row[qIdx + 3] && String(row[qIdx + 3]).trim() !== '') allOptions.push(String(row[qIdx + 3]).trim());
                    if (row[qIdx + 4] && String(row[qIdx + 4]).trim() !== '') allOptions.push(String(row[qIdx + 4]).trim());
                    
                    const exactCorrectText = allOptions[0];

                    for (let j = allOptions.length - 1; j > 0; j--) {
                        const k = Math.floor(Math.random() * (j + 1));
                        [allOptions[j], allOptions[k]] = [allOptions[k], allOptions[j]];
                    }
                    
                    const correctIdx = allOptions.indexOf(exactCorrectText);
                    
                    questions.push({
                        question: questionText,
                        options: allOptions,
                        correctAnswerIndex: correctIdx
                    });
                }

                initQuiz(filename);
            } catch (error) {
                console.error("Lỗi:", error);
                qTextEl.innerHTML = `<span style="color:red">Lỗi: Không thể tải file Excel. Vui lòng đảm bảo file <b>${filename}</b> đã được upload lên GitHub.</span>`;
            }
        }

        function initQuiz(filename) {
            if(questions.length === 0) {
                qTextEl.innerHTML = `<span style="color:red">Không tìm thấy câu hỏi hợp lệ trong file này.</span>`;
                return;
            }
            totalDisplay.innerText = questions.length;
            const currentExamName = examFiles.find(f => f.file === filename).name;
            document.getElementById('subtitleDisplay').innerText = `Bộ đề: ${currentExamName} (${questions.length} câu)`;
            loadQuestion(currentIndex);
        }

        function loadQuestion(index) {
            answeredCurrent = false;
            feedbackBox.style.display = 'none';
            btnNext.style.display = 'none';
            feedbackBox.className = 'feedback';
            
            const q = questions[index];
            qNumberEl.innerText = `Câu ${index + 1}`;
            qTextEl.innerText = q.question;
            
            progressDisplay.innerText = `${index + 1}/${questions.length}`;
            progressBar.style.width = `${((index + 1) / questions.length) * 100}%`;

            optionsListEl.innerHTML = '';
            q.options.forEach((optText, i) => {
                const label = document.createElement('label');
                label.className = 'option-item';
                
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'current_question';
                input.value = i;
                input.onclick = () => selectAnswer(i);

                const span = document.createElement('span');
                span.className = 'option-text';
                span.innerText = optText;

                label.appendChild(input);
                label.appendChild(span);
                optionsListEl.appendChild(label);
            });
        }

        function selectAnswer(selectedIndex) {
            if (answeredCurrent) return;
            answeredCurrent = true;

            const q = questions[currentIndex];
            const isCorrect = (selectedIndex === q.correctAnswerIndex);

            const inputs = optionsListEl.querySelectorAll('input[type="radio"]');
            inputs.forEach(input => input.disabled = true);

            feedbackBox.style.display = 'flex';
            if (isCorrect) {
                feedbackBox.classList.add('correct');
                feedbackIcon.innerHTML = '✅';
                feedbackText.innerText = 'Chính xác';
                score++;
                scoreDisplay.innerText = score;
            } else {
                feedbackBox.classList.add('incorrect');
                feedbackIcon.innerHTML = '❌';
                feedbackText.innerText = 'Chưa chính xác (Đáp án đúng là: ' + q.options[q.correctAnswerIndex] + ')';
            }

            btnNext.style.display = 'inline-flex';
            if (currentIndex === questions.length - 1) {
                btnNext.innerHTML = '🔄 Hoàn thành! Làm lại từ đầu';
            } else {
                btnNext.innerHTML = '➡️ Câu tiếp theo';
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                currentIndex = 0;
                score = 0;
                scoreDisplay.innerText = score;
                loadQuestion(currentIndex);
            }
        }

        window.onload = () => {
            setupDropdown();
            loadExcelData(examFiles[0].file);
        };
    </script>
</body>
</html>
