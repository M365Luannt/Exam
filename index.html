<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Trainer - Ôn Luyện</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-sidebar: #25262b;
            --bg-main: #141518;
            --text-main: #ffffff;
            --text-muted: #909296;
            --accent-blue: #339af0;
            --accent-green: #2f9e44;
            --success-bg: #1c3325;
            --success-text: #40c057;
            --error-bg: #3b1c1c;
            --error-text: #fa5252;
            --border-color: #373a40;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg-main); color: var(--text-main); }
        
        /* Giao diện máy tính */
        .sidebar { width: 300px; background-color: var(--bg-sidebar); padding: 20px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 20px; }
        .sidebar-section h3 { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; font-weight: 600; }
        .stat-box { margin-bottom: 10px; }
        .stat-value { font-size: 24px; font-weight: bold; margin-top: 5px; }
        select { width: 100%; padding: 10px; background: #1a1b1e; border: 1px solid var(--border-color); color: white; border-radius: 6px; cursor: pointer; outline: none; font-size: 14px; }
        
        /* Bảng điều hướng câu hỏi */
        .question-grid { display: flex; flex-wrap: wrap; gap: 6px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .question-grid::-webkit-scrollbar { width: 5px; }
        .question-grid::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .q-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background-color: #1a1b1e; border: 1px solid var(--border-color); border-radius: 4px; font-size: 12px; cursor: pointer; color: white; transition: 0.2s; font-weight: 600; }
        .q-btn:hover { background-color: #2c2e33; }
        .q-btn.active { background-color: var(--accent-blue); border-color: var(--accent-blue); }
        .q-btn.correct { background-color: var(--success-bg); border-color: var(--success-text); color: var(--success-text); }
        .q-btn.incorrect { background-color: var(--error-bg); border-color: var(--error-text); color: var(--error-text); }
        
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 28px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; }
        .progress-container { width: 100%; height: 6px; background-color: var(--border-color); border-radius: 3px; margin-bottom: 30px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--accent-blue); transition: width 0.3s ease; }
        .question-number { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .question-text { font-size: 16px; margin-bottom: 20px; line-height: 1.5; }
        
        .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option-item { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; padding: 10px; background-color: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid transparent; transition: 0.2s; }
        .option-item:hover { background-color: rgba(255,255,255,0.08); }
        .option-item input[type="radio"] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent-blue); cursor: pointer; }
        .option-text { font-size: 15px; line-height: 1.4; }
        
        .feedback { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; font-weight: 500; font-size: 15px; line-height: 1.5; }
        .feedback.correct { background-color: var(--success-bg); color: var(--success-text); display: flex; align-items: flex-start; gap: 10px; border: 1px solid #2b5c3d;}
        .feedback.incorrect { background-color: var(--error-bg); color: var(--error-text); display: flex; align-items: flex-start; gap: 10px; border: 1px solid #732a2a;}
        
        .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn-next { background-color: var(--accent-blue); border: none; color: white; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 15px; display: none; align-items: center; gap: 8px; font-weight: 600; width: fit-content; }
        .btn-next:hover { opacity: 0.9; }
        .btn-confirm { background-color: var(--accent-green); }

        /* Giao diện Điện thoại */
        @media (max-width: 768px) {
            body { flex-direction: column; height: 100%; min-height: 100vh; overflow-y: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); padding: 15px; flex-direction: row; flex-wrap: wrap; align-items: flex-start; gap: 10px; }
            .sidebar-section { width: 100%; margin-bottom: 0; }
            .question-grid { max-height: 140px; } /* Giới hạn chiều cao trên mobile tránh chiếm hết màn hình */
            .stat-box { flex: 1; background-color: rgba(0,0,0,0.2); padding: 10px 5px; border-radius: 8px; text-align: center; margin-bottom: 0; min-width: 30%; border: 1px solid var(--border-color); }
            .stat-box .sidebar-section h3 { margin-bottom: 2px; font-size: 10px; }
            .stat-value { font-size: 18px; margin-top: 0; }
            .main-content { padding: 20px 15px; }
            .header h1 { font-size: 22px; margin-bottom: 5px; }
            .subtitle { font-size: 13px; margin-bottom: 20px; }
            .question-number { font-size: 18px; }
            .question-text { font-size: 15px; }
            .option-text { font-size: 14px; }
            .action-buttons { flex-direction: column; width: 100%; }
            .btn-next { width: 100%; justify-content: center; padding: 14px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-section">
            <h3>Chọn bộ đề ôn luyện</h3>
            <select id="examSetSelect"></select>
        </div>
        <div class="sidebar-section">
            <h3>Cấp độ nhân viên</h3>
            <select id="levelSelect">
                <option value="all">Tất cả cấp độ</option>
                <option value="1,2" selected>Cấp độ 1 & 2 (Chuyên viên,...)</option>
                <option value="1">Chỉ Cấp độ 1</option>
                <option value="1,2,3">Cấp độ 1, 2 & 3</option>
            </select>
        </div>
        
        <!-- Bảng điều hướng câu hỏi mới thêm vào -->
        <div class="sidebar-section">
            <h3>Bảng câu hỏi</h3>
            <div class="question-grid" id="questionGrid"></div>
        </div>

        <div style="display: flex; gap: 10px; width: 100%;">
            <div class="stat-box">
                <div class="sidebar-section"><h3>Điểm</h3></div>
                <div class="stat-value" id="scoreDisplay">0</div>
            </div>
            <div class="stat-box">
                <div class="sidebar-section"><h3>Tiến độ</h3></div>
                <div class="stat-value" id="progressDisplay">0/0</div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>📝 Napas Exam </h1>
        </div>
        <div class="subtitle" id="subtitleDisplay">Đang tổng hợp dữ liệu...</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
        </div>

        <div id="quizContainer">
            <div class="question-number" id="questionNumber">Đang tải...</div>
            <div class="question-text" id="questionText">Vui lòng chờ trong lúc hệ thống tổng hợp dữ liệu từ các file Excel... (Có thể mất vài giây)</div>
            
            <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; font-weight: 600;">Chọn đáp án</div>
            <div class="options-list" id="optionsList"></div>

            <div class="feedback" id="feedbackBox">
                <span id="feedbackIcon"></span>
                <span id="feedbackText"></span>
            </div>

            <div class="action-buttons">
                <button class="btn-next btn-confirm" id="btnConfirm" onclick="confirmAnswer()">Xác nhận</button>
                <button class="btn-next" id="btnNext" onclick="nextQuestion()">➡️ Câu tiếp theo</button>
            </div>
        </div>
    </main>

    <script>
        const examFiles = [
            { file: 'P01 2026.xlsx', name: 'P01 - Nghiệp vụ thanh toán' },
            { file: 'P09 2026.xlsx', name: 'P09 - Phân tích nghiệp vụ' },
            { file: 'P10-2026.xlsx', name: 'P10 - Thiết kế kiến trúc CNTT' },
            { file: 'P11 2026.xlsx', name: 'P11 (2026)' },
            { file: 'P12 2026.xlsx', name: 'P12 - Quản trị và khai thác dữ liệu CNTT' },
            { file: 'P13-2026.xlsx', name: 'P13 - Đảm bảo chất lượng dịch vụ CNTT' },
            { file: 'P14-2026.xlsx', name: 'P14 (2026)' },
            { file: 'P16 2026.xlsx', name: 'P16 - An toàn và ANTT' },
            { file: 'P19 2026.xlsx', name: 'P19 (2026)' },
            { file: 'P26-2026.xlsx', name: 'P26 (2026)' },
            { file: 'P36-2026.xlsx', name: 'P36 (2026)' },
            { file: 'P39 2026.xlsx', name: 'P39 (2026)' }
        ];

        let allQuestions = []; 
        let questions = [];    
        let currentIndex = 0;
        let score = 0;
        let answeredCurrent = false;
        let currentSelectedAnswer = null;

        const selectEl = document.getElementById('examSetSelect');
        const levelSelectEl = document.getElementById('levelSelect');
        const questionGridEl = document.getElementById('questionGrid'); // Bảng câu hỏi
        const qNumberEl = document.getElementById('questionNumber');
        const qTextEl = document.getElementById('questionText');
        const optionsListEl = document.getElementById('optionsList');
        const feedbackBox = document.getElementById('feedbackBox');
        const feedbackIcon = document.getElementById('feedbackIcon');
        const feedbackText = document.getElementById('feedbackText');
        const btnNext = document.getElementById('btnNext');
        const btnConfirm = document.getElementById('btnConfirm');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const progressDisplay = document.getElementById('progressDisplay');
        const progressBar = document.getElementById('progressBar');

        function setupDropdowns() {
            selectEl.innerHTML = '';
            
            const optAll = document.createElement('option');
            optAll.value = 'ALL';
            optAll.textContent = '📚 TỔNG HỢP TOÀN BỘ (P01 - P39)';
            selectEl.appendChild(optAll);

            examFiles.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.file;
                opt.textContent = f.name;
                selectEl.appendChild(opt);
            });

            selectEl.addEventListener('change', (e) => {
                loadExamData(e.target.value);
            });

            levelSelectEl.addEventListener('change', () => {
                applyLevelFilter();
            });
        }

        async function fetchAndParseExcel(filename) {
            try {
                const response = await fetch(filename);
                if (!response.ok) return []; 
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const sheetName = workbook.SheetNames.find(n => n.includes('final')) || workbook.SheetNames[workbook.SheetNames.length - 1];
                const worksheet = workbook.Sheets[sheetName];
                const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                let qIdx = -1, levelIdx = -1, startIndex = 12; 
                for (let i = 0; i < 20; i++) {
                    const row = rawData[i];
                    if (!row) continue;
                    qIdx = row.findIndex(cell => typeof cell === 'string' && cell.trim() === 'Câu hỏi');
                    levelIdx = row.findIndex(cell => typeof cell === 'string' && cell.trim() === 'Cấp độ');
                    if (qIdx !== -1) { startIndex = i + 3; break; }
                }

                if (qIdx === -1) return [];

                let extractedQuestions = [];
                for (let i = startIndex; i < rawData.length; i++) {
                    const row = rawData[i];
                    if (!row || !row[qIdx] || String(row[qIdx]).trim() === '') continue; 
                    
                    const questionText = String(row[qIdx]).trim();
                    const correctAnswer = row[qIdx + 1] ? String(row[qIdx + 1]).trim() : "";
                    const levelValue = (levelIdx !== -1 && row[levelIdx]) ? String(row[levelIdx]).trim() : "1";
                    
                    if (!correctAnswer) continue; 

                    let allOptions = [correctAnswer];
                    if (row[qIdx + 2] && String(row[qIdx + 2]).trim() !== '') allOptions.push(String(row[qIdx + 2]).trim());
                    if (row[qIdx + 3] && String(row[qIdx + 3]).trim() !== '') allOptions.push(String(row[qIdx + 3]).trim());
                    if (row[qIdx + 4] && String(row[qIdx + 4]).trim() !== '') allOptions.push(String(row[qIdx + 4]).trim());
                    
                    const exactCorrectText = allOptions[0];

                    for (let j = allOptions.length - 1; j > 0; j--) {
                        const k = Math.floor(Math.random() * (j + 1));
                        [allOptions[j], allOptions[k]] = [allOptions[k], allOptions[j]];
                    }
                    
                    const correctIdx = allOptions.indexOf(exactCorrectText);
                    extractedQuestions.push({
                        question: questionText,
                        options: allOptions,
                        correctAnswerIndex: correctIdx,
                        level: levelValue,
                        status: 'unanswered', // Trạng thái để lưu cho Grid (unanswered, correct, incorrect)
                        userSelected: null    // Lựa chọn của người dùng
                    });
                }
                return extractedQuestions;
            } catch (error) {
                console.error("Lỗi đọc file:", filename, error);
                return [];
            }
        }

        async function loadExamData(selection) {
            allQuestions = [];
            questions = [];
            currentIndex = 0;
            score = 0;
            scoreDisplay.innerText = 0;
            qNumberEl.innerText = 'Đang tải...';
            qTextEl.innerText = `Hệ thống đang tải dữ liệu... Vui lòng chờ vài giây...`;
            optionsListEl.innerHTML = '';
            questionGridEl.innerHTML = '';
            feedbackBox.style.display = 'none';
            btnNext.style.display = 'none';
            btnConfirm.style.display = 'none';

            try {
                if (selection === 'ALL') {
                    const promises = examFiles.map(f => fetchAndParseExcel(f.file));
                    const results = await Promise.all(promises);
                    results.forEach(res => { allQuestions = allQuestions.concat(res); });
                } else {
                    allQuestions = await fetchAndParseExcel(selection);
                }

                if(allQuestions.length === 0) {
                     throw new Error("Không thể tải hoặc không tìm thấy câu hỏi nào.");
                }

                applyLevelFilter();

            } catch (error) {
                console.error("Lỗi:", error);
                qTextEl.innerHTML = `<span style="color:red">Lỗi: Không thể tải dữ liệu. Hãy đảm bảo các file Excel đã được upload lên GitHub.</span>`;
            }
        }

        function applyLevelFilter() {
            const selectedLevel = levelSelectEl.value;
            
            if (selectedLevel === 'all') {
                questions = [...allQuestions];
            } else {
                const allowedLevels = selectedLevel.split(',');
                questions = allQuestions.filter(q => allowedLevels.includes(q.level));
            }
            
            // Xáo trộn ngẫu nhiên câu hỏi
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }

            currentIndex = 0;
            score = 0;
            scoreDisplay.innerText = score;
            
            initQuiz();
        }

        // Tạo Bảng số câu hỏi
        function renderQuestionGrid() {
            questionGridEl.innerHTML = '';
            questions.forEach((q, i) => {
                const btn = document.createElement('div');
                btn.className = 'q-btn';
                btn.innerText = i + 1;
                btn.id = 'qbtn-' + i;
                btn.onclick = () => jumpToQuestion(i);
                
                // Phục hồi màu sắc nếu câu đó đã làm
                if(q.status === 'correct') btn.classList.add('correct');
                if(q.status === 'incorrect') btn.classList.add('incorrect');
                
                questionGridEl.appendChild(btn);
            });
        }

        // Đổi màu viền câu đang xem trên Bảng
        function updateGridUI() {
            const btns = questionGridEl.querySelectorAll('.q-btn');
            btns.forEach((btn, i) => {
                btn.classList.remove('active');
                if (i === currentIndex) {
                    btn.classList.add('active');
                    // Tự động cuộn bảng Grid đến vị trí câu hiện tại
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            });
        }

        // Hàm Nhảy cóc đến câu chọn
        function jumpToQuestion(index) {
            currentIndex = index;
            loadQuestion(currentIndex);
        }

        function initQuiz() {
            if(questions.length === 0) {
                qTextEl.innerHTML = `<span style="color:red">Không có câu hỏi nào thuộc cấp độ này. Vui lòng chọn cấp độ khác.</span>`;
                progressDisplay.innerText = '0/0';
                progressBar.style.width = '0%';
                feedbackBox.style.display = 'none';
                btnConfirm.style.display = 'none';
                btnNext.style.display = 'none';
                return;
            }
            
            let currentExamName = "Tổng hợp toàn bộ các môn";
            if (selectEl.value !== 'ALL') {
                const found = examFiles.find(f => f.file === selectEl.value);
                if (found) currentExamName = found.name;
            }

            document.getElementById('subtitleDisplay').innerText = `Bộ đề: ${currentExamName} (Đang ôn ${questions.length} câu ngẫu nhiên)`;
            
            renderQuestionGrid();
            loadQuestion(currentIndex);
        }

        function loadQuestion(index) {
            const q = questions[index];
            
            // Khôi phục trạng thái nếu câu này đã từng làm
            answeredCurrent = (q.status !== 'unanswered');
            currentSelectedAnswer = q.userSelected;
            
            feedbackBox.style.display = 'none';
            btnConfirm.style.display = 'none';
            btnNext.style.display = 'none';
            feedbackBox.className = 'feedback';
            
            qNumberEl.innerText = `Câu ${index + 1}`;
            qTextEl.innerText = q.question;
            
            progressDisplay.innerText = `${index + 1}/${questions.length}`;
            progressBar.style.width = `${((index + 1) / questions.length) * 100}%`;

            optionsListEl.innerHTML = '';
            q.options.forEach((optText, i) => {
                const label = document.createElement('label');
                label.className = 'option-item';
                
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'current_question';
                input.value = i;
                input.onclick = () => selectAnswer(i);

                // Khôi phục nút đã tick
                if (answeredCurrent && q.userSelected === i) {
                    input.checked = true;
                }
                // Nếu đã làm rồi thì khóa không cho tick lại
                if (answeredCurrent) {
                    input.disabled = true;
                }

                const span = document.createElement('span');
                span.className = 'option-text';
                span.innerText = optText;

                label.appendChild(input);
                label.appendChild(span);
                optionsListEl.appendChild(label);
            });

            // Nếu câu này đã làm trong quá khứ, hiện thẳng đáp án
            if (answeredCurrent) {
                const isCorrect = (q.correctAnswerIndex === q.userSelected);
                feedbackBox.style.display = 'flex';
                btnNext.style.display = 'inline-flex';
                btnNext.innerHTML = (currentIndex === questions.length - 1) ? '🔄 Hoàn thành! Làm lại' : '➡️ Câu tiếp theo';
                
                if (isCorrect) {
                    feedbackBox.classList.add('correct');
                    feedbackIcon.innerHTML = '✅';
                    feedbackText.innerText = 'Chính xác';
                } else {
                    feedbackBox.classList.add('incorrect');
                    feedbackIcon.innerHTML = '❌';
                    feedbackText.innerHTML = `Chưa chính xác.<br>Đáp án đúng là: <b>${q.options[q.correctAnswerIndex]}</b>`;
                }
            }

            updateGridUI(); // Sáng màu vị trí trên Grid
        }

        function selectAnswer(selectedIndex) {
            if (answeredCurrent) return;
            currentSelectedAnswer = selectedIndex;
            btnConfirm.style.display = 'inline-flex';
        }

        function confirmAnswer() {
            if (answeredCurrent || currentSelectedAnswer === null) return;
            
            answeredCurrent = true;
            const q = questions[currentIndex];
            const isCorrect = (currentSelectedAnswer === q.correctAnswerIndex);

            // Lưu trạng thái
            q.status = isCorrect ? 'correct' : 'incorrect';
            q.userSelected = currentSelectedAnswer;

            // Đổi màu trên Bảng điều hướng
            const btn = document.getElementById('qbtn-' + currentIndex);
            if(btn) btn.classList.add(q.status);

            const inputs = optionsListEl.querySelectorAll('input[type="radio"]');
            inputs.forEach(input => input.disabled = true);

            btnConfirm.style.display = 'none';

            feedbackBox.style.display = 'flex';
            if (isCorrect) {
                feedbackBox.classList.add('correct');
                feedbackIcon.innerHTML = '✅';
                feedbackText.innerText = 'Chính xác';
                score++;
                scoreDisplay.innerText = score;
            } else {
                feedbackBox.classList.add('incorrect');
                feedbackIcon.innerHTML = '❌';
                feedbackText.innerHTML = `Chưa chính xác.<br>Đáp án đúng là: <b>${q.options[q.correctAnswerIndex]}</b>`;
            }

            btnNext.style.display = 'inline-flex';
            if (currentIndex === questions.length - 1) {
                btnNext.innerHTML = '🔄 Hoàn thành! Làm lại từ đầu';
            } else {
                btnNext.innerHTML = '➡️ Câu tiếp theo';
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                // Reset bộ đề
                questions.forEach(q => {
                    q.status = 'unanswered';
                    q.userSelected = null;
                });
                currentIndex = 0;
                score = 0;
                scoreDisplay.innerText = score;
                renderQuestionGrid();
                loadQuestion(currentIndex);
            }
        }

        window.onload = () => {
            setupDropdowns();
            loadExamData('ALL');
        };
    </script>
</body>
</html>
